<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Executive Business English Simulator</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for inline JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const [apiKey, setApiKey] = useState(() => localStorage.getItem("gemini_api_key") || "");
      const [scenarios, setScenarios] = useState([]);
      const [currentUnit, setCurrentUnit] = useState(1);
      const [currentStage, setCurrentStage] = useState(1);
      const [messages, setMessages] = useState([]);
      const [isListening, setIsListening] = useState(false);
      const [inputText, setInputText] = useState("");
      const [isLoading, setIsLoading] = useState(false);
      const [feedback, setFeedback] = useState(null);
      const [isGeneratingFeedback, setIsGeneratingFeedback] = useState(false);

      const recognitionRef = useRef(null);
      const chatEndRef = useRef(null);

      // Load scenarios.json
      useEffect(() => {
        fetch("./scenarios.json")
          .then((res) => res.json())
          .then((data) => {
            setScenarios(data);
            initScenario(data[0]);
          })
          .catch((err) => console.error("Failed to load scenarios.json", err));
      }, []);

      // Auto-scroll chat
      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [messages]);

      // Initialize Speech Recognition
      useEffect(() => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
          const recognition = new SpeechRecognition();
          recognition.continuous = false;
          recognition.interimResults = false;
          recognition.lang = "en-US";

          recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            setInputText(transcript);
            setIsListening(false);
          };

          recognition.onerror = () => setIsListening(false);
          recognition.onend = () => setIsListening(false);

          recognitionRef.current = recognition;
        }
      }, []);

      const activeScenario = scenarios.find((s) => s.unit === currentUnit) || scenarios[0];

      const initScenario = (scenario) => {
        if (!scenario) return;
        setCurrentStage(1);
        setFeedback(null);
        setMessages([
          {
            role: "assistant",
            content: scenario.opening_line,
            stage: 1
          }
        ]);
        speakText(scenario.opening_line);
      };

      const handleUnitChange = (unitNum) => {
        const target = scenarios.find((s) => s.unit === Number(unitNum));
        setCurrentUnit(Number(unitNum));
        initScenario(target);
      };

      const speakText = (text) => {
        if ("speechSynthesis" in window) {
          window.speechSynthesis.cancel();
          const cleanText = text.replace(/\[STAGE_\d+\]/g, "").replace(/\[SIMULATION_COMPLETE\]/g, "");
          const utterance = new SpeechSynthesisUtterance(cleanText);
          utterance.lang = "en-US";
          utterance.rate = 0.95;
          window.speechSynthesis.speak(utterance);
        }
      };

      const toggleMic = () => {
        if (!recognitionRef.current) {
          alert("Speech recognition is not supported in this browser. Please use Chrome or Edge.");
          return;
        }
        if (isListening) {
          recognitionRef.current.stop();
          setIsListening(false);
        } else {
          setInputText("");
          recognitionRef.current.start();
          setIsListening(true);
        }
      };

      const handleSendMessage = async () => {
        if (!inputText.trim() || !apiKey) return;

        const userMsg = { role: "user", content: inputText, stage: currentStage };
        const updatedMessages = [...messages, userMsg];
        setMessages(updatedMessages);
        setInputText("");
        setIsLoading(true);

        const currentStageData = activeScenario.stages.find((s) => s.stage === currentStage) || activeScenario.stages[activeScenario.stages.length - 1];

        const systemInstruction = `
You are acting as the enterprise counterpart in a corporate business English simulation.
Persona: ${activeScenario.persona}
Unit Topic: ${activeScenario.title}
Framework: ${activeScenario.framework}

CURRENT STAGE: Stage ${currentStage} (${currentStageData.name})
STAGE BEHAVIOR: ${currentStageData.ai_behavior}
STAGE ADVANCEMENT TRIGGER: ${currentStageData.advancement_trigger}

RULES:
1. Stay in character as a business professional. Be realistic, candid, and direct.
2. If the user meets the stage advancement trigger, advance to the next stage in your logic.
3. If advancing to stage 2, prefix your response with [STAGE_2].
4. If advancing to stage 3, prefix your response with [STAGE_3].
5. If stage 3 requirements are met and the conversation reaches a natural close, append [SIMULATION_COMPLETE] at the end.
6. Keep each spoken turn concise (2 to 4 sentences maximum), authentic to executive conversation.
        `;

        try {
          const contents = [
            { role: "user", parts: [{ text: systemInstruction }] },
            ...updatedMessages.map((m) => ({
              role: m.role === "assistant" ? "model" : "user",
              parts: [{ text: m.content }]
            }))
          ];

          const response = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ contents })
            }
          );

          const data = await response.json();
          let replyText = data.candidates?.[0]?.content?.parts?.[0]?.text || "No response received.";

          // Detect Stage Updates
          let newStage = currentStage;
          if (replyText.includes("[STAGE_2]") && currentStage < 2) newStage = 2;
          if (replyText.includes("[STAGE_3]") && currentStage < 3) newStage = 3;
          setCurrentStage(newStage);

          const isCompleted = replyText.includes("[SIMULATION_COMPLETE]");
          const cleanedReply = replyText.replace(/\[STAGE_\d+\]/g, "").replace(/\[SIMULATION_COMPLETE\]/g, "").trim();

          const assistantMsg = { role: "assistant", content: cleanedReply, stage: newStage };
          const finalMessages = [...updatedMessages, assistantMsg];
          setMessages(finalMessages);
          speakText(cleanedReply);

          if (isCompleted) {
            triggerFeedback(finalMessages);
          }
        } catch (error) {
          console.error(error);
          alert("Error calling Gemini API. Please check your API key and connection.");
        } finally {
          setIsLoading(false);
        }
      };

      const triggerFeedback = async (transcript) => {
        setIsGeneratingFeedback(true);
        const rubricText = JSON.stringify(activeScenario.rubric, null, 2);

        const prompt = `
You are an executive communication coach evaluating a corporate learner's performance.
Scenario: ${activeScenario.title}
Target Framework: ${activeScenario.framework}
Rubric:
${rubricText}

Transcript:
${transcript.map((m) => `${m.role.toUpperCase()}:${m.content}`).join("\n")}

Provide an objective executive coaching debrief in structured JSON with the following format:
{
  "overallScore": "Score out of 5",
  "frameworkAssessment": "Did the learner properly follow the unit framework steps?",
  "strengths": ["Point 1", "Point 2"],
  "growthAreas": ["Point 1", "Point 2"],
  "executiveRewrites": [
    {
      "original": "Exact quote of what the learner said",
      "executiveAlternative": "Polished, authentic executive phrasing alternative",
      "reasoning": "Why this alternative lands with higher executive presence"
    }
  ]
}
Return ONLY valid JSON.
        `;

        try {
          const response = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            }
          );
          const data = await response.json();
          let rawJson = data.candidates?.[0]?.content?.parts?.[0]?.text || "{}";
          rawJson = rawJson.replace(/```json/g, "").replace(/```/g, "").trim();
          setFeedback(JSON.parse(rawJson));
        } catch (err) {
          console.error("Feedback generation failed", err);
        } finally {
          setIsGeneratingFeedback(false);
        }
      };

      return (
        <div className="max-w-5xl mx-auto p-4 md:p-6 flex flex-col h-screen">
          {/* Header & Settings */}
          <header className="border-b border-slate-800 pb-4 mb-4 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
            <div>
              <h1 className="text-xl font-bold tracking-tight text-white">Executive Business English Simulator</h1>
              <p className="text-xs text-slate-400">Situation-based Topic Discussion & Role-play</p>
            </div>
            <div className="flex items-center gap-3">
              <input
                type="password"
                placeholder="Paste Gemini API Key"
                value={apiKey}
                onChange={(e) => {
                  setApiKey(e.target.value);
                  localStorage.setItem("gemini_api_key", e.target.value);
                }}
                className="bg-slate-900 border border-slate-700 px-3 py-1.5 rounded text-xs w-44 focus:outline-none focus:border-indigo-500"
              />
              <select
                value={currentUnit}
                onChange={(e) => handleUnitChange(e.target.value)}
                className="bg-slate-900 border border-slate-700 px-3 py-1.5 rounded text-xs text-white focus:outline-none focus:border-indigo-500"
              >
                {scenarios.map((s) => (
                  <option key={s.unit} value={s.unit}>
                    Unit {s.unit}: {s.title}
                  </option>
                ))}
              </select>
            </div>
          </header>

          {/* Scenario Status Bar */}
          {activeScenario && (
            <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 mb-4 flex flex-col md:flex-row md:items-center justify-between text-xs gap-2">
              <div>
                <span className="text-indigo-400 font-semibold uppercase tracking-wider mr-2">Framework:</span>
                <span className="text-slate-300">{activeScenario.framework}</span>
              </div>
              <div className="flex items-center gap-2">
                <span className="text-slate-400">Stage:</span>
                <span className={`px-2 py-0.5 rounded text-xs font-semibold ${currentStage === 1 ? 'bg-amber-500/20 text-amber-300' : 'bg-slate-800 text-slate-400'}`}>1. Discovery</span>
                <span className={`px-2 py-0.5 rounded text-xs font-semibold ${currentStage === 2 ? 'bg-amber-500/20 text-amber-300' : 'bg-slate-800 text-slate-400'}`}>2. Diagnostic</span>
                <span className={`px-2 py-0.5 rounded text-xs font-semibold ${currentStage === 3 ? 'bg-emerald-500/20 text-emerald-300' : 'bg-slate-800 text-slate-400'}`}>3. Alignment</span>
              </div>
            </div>
          )}

          {/* Main Area */}
          <div className="flex-1 overflow-hidden flex flex-col md:flex-row gap-4">
            {/* Conversation Log */}
            <div className="flex-1 bg-slate-900/60 border border-slate-800 rounded-lg flex flex-col overflow-hidden">
              <div className="flex-1 p-4 overflow-y-auto space-y-4 text-sm">
                {messages.map((m, idx) => (
                  <div key={idx} className={`flex flex-col ${m.role === 'user' ? 'items-end' : 'items-start'}`}>
                    <span className="text-[10px] text-slate-400 mb-1 capitalize">
                      {m.role === 'user' ? 'You' : activeScenario?.persona || 'Client'}
                    </span>
                    <div className={`p-3 rounded-lg max-w-[85%] leading-relaxed ${
                      m.role === 'user' ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-slate-800 text-slate-200 rounded-bl-none border border-slate-700'
                    }`}>
                      {m.content}
                    </div>
                  </div>
                ))}
                {isLoading && (
                  <div className="text-xs text-slate-400 italic">Client is replying...</div>
                )}
                <div ref={chatEndRef} />
              </div>

              {/* Input & Voice Controls */}
              <div className="p-3 border-t border-slate-800 bg-slate-900/90 flex items-center gap-2">
                <button
                  onClick={toggleMic}
                  className={`p-2.5 rounded-full transition ${
                    isListening ? 'bg-red-500 text-white animate-pulse' : 'bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700'
                  }`}
                  title={isListening ? "Listening..." : "Click to Speak"}
                >
                  <svg className="w-4 h-4 fill-current" viewBox="0 0 24 24">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                  </svg>
                </button>
                <input
                  type="text"
                  value={inputText}
                  onChange={(e) => setInputText(e.target.value)}
                  onKeyDown={(e) => e.key === "Enter" && handleSendMessage()}
                  placeholder={isListening ? "Listening to your voice..." : "Type or speak your executive response..."}
                  className="flex-1 bg-slate-950 border border-slate-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-indigo-500"
                />
                <button
                  onClick={handleSendMessage}
                  disabled={isLoading}
                  className="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-4 py-2.5 rounded font-medium disabled:opacity-50"
                >
                  Send
                </button>
                <button
                  onClick={() => triggerFeedback(messages)}
                  disabled={messages.length <= 1 || isGeneratingFeedback}
                  className="bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 text-xs px-3 py-2.5 rounded disabled:opacity-40"
                  title="Generate Scorecard"
                >
                  {isGeneratingFeedback ? "Evaluating..." : "Debrief"}
                </button>
              </div>
            </div>

            {/* Target Phrases & Scorecard Panel */}
            <div className="w-full md:w-80 flex flex-col gap-4 overflow-y-auto">
              {/* Target Phrasing Helper */}
              <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 text-xs">
                <h3 className="font-semibold text-slate-300 mb-2 uppercase tracking-wider text-[11px]">Recommended Phrasing</h3>
                <ul className="space-y-2 text-slate-400">
                  {activeScenario?.target_expressions?.map((expr, idx) => (
                    <li key={idx} className="bg-slate-950 p-2 rounded border border-slate-800/80 italic">
                      "{expr}"
                    </li>
                  ))}
                </ul>
              </div>

              {/* Feedback Scorecard */}
              {feedback && (
                <div className="bg-slate-900 border border-indigo-900/50 rounded-lg p-3 text-xs space-y-3">
                  <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                    <span className="font-bold text-indigo-300">Executive Scorecard</span>
                    <span className="bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded font-bold">
                      {feedback.overallScore}
                    </span>
                  </div>

                  <div>
                    <span className="text-[11px] font-semibold text-slate-400 block mb-1">Framework Adherence</span>
                    <p className="text-slate-300">{feedback.frameworkAssessment}</p>
                  </div>

                  <div>
                    <span className="text-[11px] font-semibold text-slate-400 block mb-1">Polished Alternatives</span>
                    <div className="space-y-2">
                      {feedback.executiveRewrites?.map((rw, idx) => (
                        <div key={idx} className="bg-slate-950 p-2 rounded border border-slate-800">
                          <p className="text-red-400 line-through mb-1">"{rw.original}"</p>
                          <p className="text-emerald-400 font-medium">"{rw.executiveAlternative}"</p>
                          <p className="text-slate-500 text-[10px] mt-1">{rw.reasoning}</p>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
